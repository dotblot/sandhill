[package]
name = "sandhill-gpui"
description = "A trial Sandhill app drawn with GPUI instead of a web view"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, so the trial's dependencies stay out of the main build,
# its Cargo.lock and CI.
[workspace]

[[bin]]
name = "sandhill-gpui"
path = "src/main.rs"

[dependencies]
sandhill-proto = { path = "../crates/proto" }
sandhill-link = { path = "../crates/link" }
# For the output and Quarto chunk rules the daemon and the web UI share.
sandhill-daemon = { path = "../crates/daemon" }
anyhow = "1"
gpui-kit = "=0.8.1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
