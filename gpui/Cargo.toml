[package]
name = "sandhill-gpui"
description = "A trial Sandhill app drawn with GPUI instead of a web view"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, so the trial's dependencies stay out of the main build,
# its Cargo.lock and CI.
[workspace]

[[bin]]
name = "sandhill-gpui"
path = "src/main.rs"

[dependencies]
sandhill-proto = { path = "../crates/proto" }
sandhill-link = { path = "../crates/link" }
# For the output and Quarto chunk rules the daemon and the web UI share.
sandhill-daemon = { path = "../crates/daemon" }
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
gpui-kit = { version = "=0.8.1", features = ["tree-sitter-python", "tree-sitter-markdown"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# gpui-kit has no R grammar; Posit's (MIT) is registered at start-up.
tree-sitter = "0.26"
tree-sitter-r = "1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
