[package]
name = "sandhill-daemon"
description = "sandhilld: keeps kernels, outputs, jobs and agents alive on the analysis machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sandhilld"
path = "src/main.rs"

[dependencies]
sandhill-proto.workspace = true
anyhow.workspace = true
base64 = "0.23"
clap.workspace = true
jupyter-protocol.workspace = true
jupyter-zmq-client.workspace = true
libc.workspace = true
rusqlite.workspace = true
scraper = "0.29"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "1"
toml_edit = "0.25"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeromq.workspace = true
# Archives from the file tree; pure Rust, so server builds need no C
# libraries. MIT, MIT/Apache-2.0 (noodles-bgzf: MIT).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
noodles-bgzf = "0.52"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Apache-2.0/MIT, compatible with GPL-3.0-or-later.
security-framework = "3.7"
# The system's own Move to Trash (each disk has its Trash). MIT/Apache-2.0.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
sandhill-link.workspace = true
tempfile.workspace = true
