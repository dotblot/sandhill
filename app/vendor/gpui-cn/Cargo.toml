description = "shadcn-style components for GPUI, built on gpui-base."
homepage = "https://github.com/prabirshrestha/gpui-cn"
documentation = "https://docs.rs/gpui-cn"
readme = "README.md"
keywords = [
    "gpui",
    "ui",
    "shadcn",
    "components",
    "desktop",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/prabirshrestha/gpui-cn"
resolver = "2"

# Sandhill adaptation: isolate the vendored crate's own maintenance checks.
