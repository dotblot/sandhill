[dependencies.damascene-fonts-jetbrains-mono]
version = "0.1"
optional = true

[dependencies.ghostty-vt]
version = "0.8.0"
optional = true

# Sandhill adaptation (2026-11-06, moved to 0.9.1 on 2026-11-13, to 0.10.0
# on 2026-11-16): use the GPUI Kit release stack.
[dependencies.gpui-kit]
version = "=0.10.0"
features = ["assets"]
default-features = false

[dependencies.gpui-webview]
version = "=0.10.0"
optional = true
default-features = false

[dependencies.nucleo-matcher]
version = "0.3"

[dependencies.smol]
version = "2"

[dependencies.wry]
version = "0.53.3"
optional = true
package = "lb-wry"

[dev-dependencies.gpui-kit]
version = "=0.10.0"
features = ["test-support"]
default-features = false

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies.portable-pty]
version = "0.9"
optional = true

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]
optional = true

