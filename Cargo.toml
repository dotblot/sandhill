[workspace]
resolver = "3"
members = ["crates/proto", "crates/link", "crates/daemon", "crates/cli", "app/src-tauri"]
# A plain `cargo build` builds what a server needs. The app needs WebKit
# (system WebKitGTK on Linux), so build it with `-p sandhill-app`,
# `--workspace` or `npm run tauri` in app/.
default-members = ["crates/proto", "crates/link", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sandhill-proto = { path = "crates/proto" }
sandhill-link = { path = "crates/link" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Hashing runs at every daemon start (to identify the build) and for every
# stored output; unoptimized it takes seconds on a debug build's executable.
[profile.dev.package.sha2]
opt-level = 3
