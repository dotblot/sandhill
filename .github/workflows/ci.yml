name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Python, IRkernel, Ark)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Python and R kernels, and WebKitGTK for the app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-ipykernel r-base-core r-cran-irkernel \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
          python3 -m ipykernel install --user
          # r-cran-irkernel ships its kernelspec in /usr/share/jupyter/kernels/ir,
          # so IRkernel::installspec() (which needs the jupyter CLI) isn't needed.
      - name: Install Ark (Posit's R kernel)
        # Best effort: if this fails, the R test falls back to IRkernel.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo posit-dev/ark --pattern '*linux-x64*.zip' --dir /tmp/ark
          unzip -o /tmp/ark/*.zip -d /tmp/ark
          /tmp/ark/ark --install
      - name: List installed kernels
        run: ls -d ~/.local/share/jupyter/kernels/* /usr/share/jupyter/kernels/*
      - name: UI tests and build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: macOS (Apple silicon, Python, app bundle)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Static Linux builds of sandhilld, which the app installs on servers.
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python kernel, and zig for cross-building
        # cargo-zigbuild runs zig as `python3 -m ziglang`.
        run: |
          python -m pip install ipykernel ziglang==0.17.0
          python -m ipykernel install --user
      - run: cargo test --workspace
      - name: Build Sandhill.app
        working-directory: app
        run: |
          npm ci
          npm run bundle -- --servers
      - name: Zip the app
        # ditto keeps the bundle's symlinks, permissions and signature.
        run: ditto -c -k --keepParent target/release/bundle/macos/Sandhill.app Sandhill-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sandhill-macos-arm64
          path: Sandhill-macos-arm64.zip
          retention-days: 14
