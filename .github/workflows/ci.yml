name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Can also be started by hand from the Actions tab (CI, Run workflow).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Python, IRkernel, Ark)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Python and R kernels, pandas for the Data Explorer tests, matplotlib for redrawing plots, and WebKitGTK for the app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-ipykernel python3-pandas python3-matplotlib r-base-core r-cran-irkernel r-cran-dt r-cran-htmlwidgets r-cran-shiny \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
          python3 -m ipykernel install --user
          # r-cran-irkernel ships its kernelspec in /usr/share/jupyter/kernels/ir,
          # so IRkernel::installspec() (which needs the jupyter CLI) isn't needed.
      - name: Install Ark (Posit's R kernel)
        env:
          GH_TOKEN: ${{ github.token }}
        # Ark marks no release as "latest", so take the newest one, as
        # app/scripts/bundle.mjs does.
        run: |
          tag=$(gh api 'repos/posit-dev/ark/releases?per_page=30' \
            --jq '[.[] | select(.draft | not)] | (map(select(.prerelease | not)) + .)[0].tag_name')
          echo "Ark $tag"
          # Not ark-<version>-debug-linux-x64.zip.
          gh release download "$tag" --repo posit-dev/ark --pattern "ark-$tag-linux-x64.zip" --dir /tmp/ark
          unzip -o "/tmp/ark/ark-$tag-linux-x64.zip" -d /tmp/ark
          /tmp/ark/ark --install
      - name: Probe
        run: cargo test -p sandhill-daemon --test probe_viewer -- --nocapture
        env:
          SANDHILL_TEST_ARK: /tmp/ark/ark

