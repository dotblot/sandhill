name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Can also be started by hand from the Actions tab (CI, Run workflow).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Python, IRkernel, Ark)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python and R kernels, pandas for the Data Explorer tests, matplotlib for redrawing plots, DT and Shiny for the Viewer's
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-ipykernel python3-pandas python3-matplotlib r-base-core r-cran-irkernel r-cran-dt r-cran-shiny
          python3 -m ipykernel install --user
          # r-cran-irkernel ships its kernelspec in /usr/share/jupyter/kernels/ir,
          # so IRkernel::installspec() (which needs the jupyter CLI) isn't needed.
      - name: Install Ark (Posit's R kernel)
        env:
          GH_TOKEN: ${{ github.token }}
        # Ark marks no release as "latest", so take the newest one, as the
        # app's bundle does (mac-app.yml).
        run: |
          tag=$(gh api 'repos/posit-dev/ark/releases?per_page=30' \
            --jq '[.[] | select(.draft | not)] | (map(select(.prerelease | not)) + .)[0].tag_name')
          echo "Ark $tag"
          # Not ark-<version>-debug-linux-x64.zip.
          gh release download "$tag" --repo posit-dev/ark --pattern "ark-$tag-linux-x64.zip" --dir /tmp/ark
          unzip -o "/tmp/ark/ark-$tag-linux-x64.zip" -d /tmp/ark
          /tmp/ark/ark --install
      - name: Install Codex, for the Codex chat test
        # The version the bridge was written against; the test talks to a
        # stand-in model, so it needs no login.
        run: npm install -g @openai/codex@0.163.0
      - name: List installed kernels
        run: |
          ls -d ~/.local/share/jupyter/kernels/* /usr/share/jupyter/kernels/*
          cat ~/.local/share/jupyter/kernels/ark/kernel.json
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test file runs, so one failure doesn't hide the next.
      - run: cargo test --workspace --no-fail-fast
        env:
          # Ark as the app installs it on servers (crates/daemon/tests/ark.rs).
          SANDHILL_TEST_ARK: /tmp/ark/ark

  macos:
    name: macOS (Apple silicon, Python)
    # The app itself is checked and bundled by mac-app.yml.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python kernel
        run: |
          python -m pip install ipykernel
          python -m ipykernel install --user
      - run: cargo test --workspace --no-fail-fast
